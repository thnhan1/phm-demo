<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Error</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #333;
    }

    .error-container {
      background-color: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      color: #d32f2f; /* Màu đỏ cho tiêu đề lỗi */
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #4caf50; /* Màu xanh lá cây cho nút về trang chủ */
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #45a049;
    }

    .emoji { /* Thêm emoji cho sinh động */
      font-size: 2em;
      margin-bottom: 10px;
      animation: bounce 1s infinite; /* Hiệu ứng nhún nhảy */
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40%, 60% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="emoji">¯\_(ツ)_/¯</div>  <h1>An error has occurred</h1>
  <p th:text="${errorMessage}"></p>
  <a href="/">Go to home</a>
</div>
</body>
</html>
